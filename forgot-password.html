<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Meeting Room Booking</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <!-- Already signed in? Go to the app. -->
  <script>if (localStorage.getItem("mrb_session")) location.replace("index.html");</script>
</head>
<body>
  <button class="lang-toggle float" type="button">PT</button>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-brand"><span class="logo">▦</span> <span data-i18n="brand">Meeting Room Booking</span></h1>
      <h2 data-i18n="title.forgot">Forgot your password?</h2>
      <p class="page-sub" data-i18n="sub.forgot">Enter your username and an administrator will be notified to reset it.</p>

      <form id="forgotForm">
        <label for="fpUser" data-i18n="label.username">Username</label>
        <input id="fpUser" type="text" data-i18n-ph="ph.usernameEg" placeholder="e.g. slanga" autocomplete="username" required />

        <button type="submit" class="block" id="fpBtn" data-i18n="btn.requestReset">Request password reset</button>
        <div id="fpAlert" class="alert"></div>
        <p class="auth-forgot"><a href="login.html" data-i18n="forgot.back">Back to sign in</a></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forgot.js"></script>
</body>
</html>
