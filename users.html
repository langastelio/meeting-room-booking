<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Meeting Room Booking</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <!-- Require ADMIN before showing this page -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("mrb_session"));
        if (!s) location.replace("login.html");
        else if (s.mustReset) location.replace("reset-password.html");
        else if (s.role !== "admin") location.replace("index.html");
      } catch (e) { location.replace("login.html"); }
    })();
  </script>
</head>
<body>
  <header>
    <h1><span class="logo">▦</span> Meeting Room Booking</h1>
    <nav>
      <a href="index.html">Book a Room</a>
      <a href="admin.html" id="navAdmin">Admin</a>
      <a href="users.html" id="navUsers" class="active">Users</a>
      <a href="history.html" id="navHistory">History</a>
      <span class="user-badge" id="userBadge"></span>
      <button class="theme-toggle" type="button">☀️</button>
      <button class="logout" id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <main>
    <h2 class="page-title">Users</h2>
    <p class="page-sub">Create accounts and control who can access the system. Only admins can open this page.</p>

    <div class="grid two">
      <!-- Create user -->
      <section class="card">
        <h2>Create a User</h2>
        <form id="userForm">
          <label for="newName">Full name</label>
          <input id="newName" type="text" placeholder="e.g. Stelio Langa" autocomplete="off" required />

          <label for="newUsername">Username</label>
          <input id="newUsername" type="text" placeholder="e.g. slanga" autocomplete="off" required />

          <label for="newEmail">Email <span class="muted-note" style="display:inline">(for notifications)</span></label>
          <input id="newEmail" type="email" placeholder="e.g. stelio@company.com" autocomplete="off" />

          <label for="newPassword">Temporary password</label>
          <input id="newPassword" type="text" placeholder="they'll reset it on first login" autocomplete="new-password" required />

          <label for="newRole">Role</label>
          <select id="newRole">
            <option value="user">User — can book rooms</option>
            <option value="admin">Admin — can manage rooms &amp; users</option>
          </select>

          <button type="submit" class="block">Create User</button>
          <div id="userAlert" class="alert"></div>
        </form>
      </section>

      <!-- User list -->
      <section class="card">
        <h2>Existing Users</h2>
        <table>
          <thead>
            <tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="userList"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/users.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/idle.js"></script>
</body>
</html>
