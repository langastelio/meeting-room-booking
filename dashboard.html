<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Meeting Room Booking</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <!-- Require ADMIN before showing this page -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("mrb_session"));
        if (!s) location.replace("login.html");
        else if (s.mustReset) location.replace("reset-password.html");
        else if (s.role !== "admin") location.replace("index.html");
      } catch (e) { location.replace("login.html"); }
    })();
  </script>
</head>
<body>
  <header>
    <h1><span class="logo">▦</span> <span data-i18n="brand">Meeting Room Booking</span></h1>
    <nav>
      <a href="index.html" data-i18n="nav.book">Book a Room</a>
      <a href="calendar.html" id="navCalendar" data-i18n="nav.calendar">Calendar</a>
      <a href="dashboard.html" id="navDashboard" class="active" data-i18n="nav.dashboard">Dashboard</a>
      <a href="admin.html" id="navAdmin" data-i18n="nav.admin">Manage Rooms</a>
      <a href="users.html" id="navUsers" data-i18n="nav.users">Users</a>
      <a href="history.html" id="navHistory" data-i18n="nav.history">History</a>
      <span class="user-badge" id="userBadge"></span>
      <button class="lang-toggle" type="button">PT</button>
      <button class="theme-toggle" type="button">☀️</button>
      <button class="logout" id="logoutBtn" type="button" data-i18n="btn.logout">Logout</button>
    </nav>
  </header>

  <main>
    <h2 class="page-title" data-i18n="title.dashboard">Dashboard</h2>
    <p class="page-sub" data-i18n="sub.dashboard">Room usage at a glance — totals, busiest rooms, peak hours and cancellations.</p>

    <div class="stat-grid" id="statGrid"></div>

    <div class="grid two">
      <section class="card">
        <h2 data-i18n="dash.topRooms">Most-booked rooms</h2>
        <div id="chartRooms" class="barchart"></div>
      </section>
      <section class="card">
        <h2 data-i18n="dash.peakHours">Peak hours</h2>
        <div id="chartHours" class="barchart"></div>
      </section>
      <section class="card">
        <h2 data-i18n="dash.byWeekday">Busiest weekdays</h2>
        <div id="chartDays" class="barchart"></div>
      </section>
      <section class="card">
        <h2 data-i18n="dash.topBookers">Top bookers</h2>
        <div id="chartBookers" class="barchart"></div>
      </section>
    </div>
    <p class="muted-note" data-i18n="dash.range">Counts exclude cancelled meetings, except where noted.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/idle.js"></script>
</body>
</html>
