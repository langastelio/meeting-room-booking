<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Meeting Room Booking</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <!-- Already signed in? Skip straight to the app. -->
  <script>if (localStorage.getItem("mrb_session")) location.replace("index.html");</script>
</head>
<body>
  <button class="lang-toggle float" type="button">PT</button>

  <div id="loader" class="loader-overlay">
    <div class="loader-brand"><span class="logo">▦</span> <span data-i18n="brand">Meeting Room Booking</span></div>
    <div class="loader-spinner"></div>
    <div class="loader-bar"><span></span></div>
    <div class="loader-text" data-i18n="loading">Loading…</div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-brand"><span class="logo">▦</span> <span data-i18n="brand">Meeting Room Booking</span></h1>
      <h2 id="authTitle" data-i18n="title.signin">Sign in</h2>
      <p class="page-sub" id="authSub" data-i18n="sub.signin">Enter your credentials to continue.</p>

      <form id="authForm">
        <div id="nameRow" style="display:none;">
          <label for="fullName" data-i18n="label.fullName">Your full name</label>
          <input id="fullName" type="text" placeholder="e.g. Stelio Langa" autocomplete="name" />
        </div>

        <label for="username" data-i18n="label.username">Username</label>
        <input id="username" type="text" data-i18n-ph="ph.usernameEg" placeholder="e.g. slanga" autocomplete="username" required />

        <label for="password" data-i18n="label.password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button type="submit" class="block" id="authBtn" data-i18n="btn.signin">Sign in</button>
        <div id="authAlert" class="alert"></div>
        <p class="auth-forgot" id="forgotRow">
          <a href="#" id="forgotLink" data-i18n="forgot.link">Forgot password?</a>
        </p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
