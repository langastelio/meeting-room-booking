<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Meeting Room Booking</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- Apply saved theme before paint to avoid a flash -->
  <script src="js/theme.js"></script>
  <!-- Require ADMIN before showing this page -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("mrb_session"));
        if (!s) location.replace("login.html");
        else if (s.mustReset) location.replace("reset-password.html");
        else if (s.role !== "admin") location.replace("index.html");
      } catch (e) { location.replace("login.html"); }
    })();
  </script>
</head>
<body>
  <header>
    <h1><span class="logo">▦</span> Meeting Room Booking</h1>
    <nav>
      <a href="index.html">Book a Room</a>
      <a href="admin.html" id="navAdmin" class="active">Admin</a>
      <a href="users.html" id="navUsers">Users</a>
      <a href="history.html" id="navHistory">History</a>
      <span class="user-badge" id="userBadge"></span>
      <button class="theme-toggle" type="button">☀️</button>
      <button class="logout" id="logoutBtn" type="button">Logout</button>
    </nav>
  </header>

  <main>
    <h2 class="page-title">Admin — Manage Rooms</h2>
    <p class="page-sub">Add and remove meeting rooms. Changes save straight to the database.</p>

    <div class="grid two">
      <!-- Add room form -->
      <section class="card">
        <h2>Add a Meeting Room</h2>
        <form id="roomForm">
          <label for="name">Room Name</label>
          <input id="name" type="text" placeholder="e.g. Boardroom B" required />

          <label for="location">Location</label>
          <input id="location" type="text" placeholder="e.g. 2nd Floor - West Wing" required />

          <label for="capacity">Capacity (seats)</label>
          <input id="capacity" type="number" min="1" placeholder="e.g. 8" required />

          <label for="facilities">Facilities (comma separated)</label>
          <input id="facilities" type="text" placeholder="e.g. Projector, Whiteboard, TV" />

          <button type="submit" class="block">Add Room</button>
          <div id="roomAlert" class="alert"></div>
        </form>
      </section>

      <!-- Room list -->
      <section class="card">
        <h2>Current Rooms</h2>
        <table>
          <thead>
            <tr><th>Name</th><th>Location</th><th>Seats</th><th>Facilities</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="adminRoomList"></tbody>
        </table>
      </section>
    </div>
  </main>

  <!-- Supabase client (shared database) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/idle.js"></script>
</body>
</html>
